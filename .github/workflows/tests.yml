name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "10.*"
            testbench: "^8.0"
            pest: "^2.0"
            pest_plugin: "^2.0"
            larastan: "^2.0"
            collision: "^7.0"
          - php: "8.2"
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^3.0"
            pest_plugin: "^3.0"
            larastan: "^3.0"
            collision: "^8.0"
          - php: "8.3"
            laravel: "10.*"
            testbench: "^8.0"
            pest: "^2.0"
            pest_plugin: "^2.0"
            larastan: "^2.0"
            collision: "^7.0"
          - php: "8.3"
            laravel: "11.*"
            testbench: "^9.0"
            pest: "^3.0"
            pest_plugin: "^3.0"
            larastan: "^3.0"
            collision: "^8.0"
          - php: "8.3"
            laravel: "12.*"
            testbench: "^10.0"
            pest: "^3.0"
            pest_plugin: "^3.0"
            larastan: "^3.0"
            collision: "^8.0"
          - php: "8.2"
            laravel: "13.*"
            testbench: "^11.0"
            pest: "^4.0"
            pest_plugin: "^4.0"
            larastan: "^3.0"
            collision: "^8.0"
          - php: "8.3"
            laravel: "13.*"
            testbench: "^11.0"
            pest: "^4.0"
            pest_plugin: "^4.0"
            larastan: "^3.0"
            collision: "^8.0"
          - php: "8.4"
            laravel: "13.*"
            testbench: "^11.0"
            pest: "^4.0"
            pest_plugin: "^4.0"
            larastan: "^3.0"
            collision: "^8.0"

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, curl
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }}" \
            "larastan/larastan:${{ matrix.larastan }}" \
            "nunomaduro/collision:${{ matrix.collision }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
